schema_version: "1.1"
name: perm-ca-403-troubleshoot
expected_outcome: |
  Diagnoses both layers using the bundled lookups: the required delegated scopes (including Policy.Read.All and the documented known consent issue) and whether the signed-in user's Entra role is sufficient for writing CA policies, gives the least-privileged fix, and commands to check the session scopes and role assignments, with sources.
